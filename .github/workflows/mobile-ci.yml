name: Mobile CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests, lint, and release contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LilyCrest-Clean/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LilyCrest-Clean/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies for cross-layer tests
        working-directory: LilyCrest-Clean/backend
        run: npm ci --ignore-scripts

      - name: Run full frontend suite
        run: npm test -- --runInBand

      - name: Run lint
        run: npm run lint

      - name: Verify release contract
        run: npm run verify:release-contract

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LilyCrest-Clean/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LilyCrest-Clean/backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run full backend suite
        run: npm test

  android:
    name: Android release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LilyCrest-Clean/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LilyCrest-Clean/frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Verify release contract
        run: npm run verify:release-contract

      - name: Configure Google services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON repository secret is required for release builds." >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const config = JSON.parse(process.env.GOOGLE_SERVICES_JSON);
          const packageName = 'com.lilycrest.lilycrestdorm';
          const client = (config.client || []).find((entry) => entry.client_info?.android_client_info?.package_name === packageName);
          if (!client) throw new Error(`google-services.json does not contain ${packageName}`);
          const apiKey = client.api_key?.[0]?.current_key || '';
          const androidClientId = client.oauth_client?.find((entry) => entry.client_type === 1)?.client_id || '';
          const webClientId = client.oauth_client?.find((entry) => entry.client_type === 3)?.client_id || '';
          const projectId = config.project_info?.project_id || '';
          const appId = client.client_info?.mobilesdk_app_id || '';
          if (![apiKey, androidClientId, webClientId, projectId, appId].every(Boolean)) {
            throw new Error('google-services.json is missing required production Firebase/OAuth client data');
          }
          const target = path.join('android', 'app', 'src', 'production', 'google-services.json');
          fs.mkdirSync(path.dirname(target), { recursive: true });
          fs.writeFileSync(target, process.env.GOOGLE_SERVICES_JSON);
          fs.appendFileSync(process.env.GITHUB_ENV, [
            'NODE_ENV=production',
            'EXPO_PUBLIC_DEPLOYMENT_ENV=production',
            'EXPO_PUBLIC_BACKEND_URL=https://api.lilycrest.space',
            'LILYCREST_ANDROID_FLAVOR=production',
            `EXPO_PUBLIC_FIREBASE_API_KEY=${apiKey}`,
            `EXPO_PUBLIC_FIREBASE_ANDROID_API_KEY=${apiKey}`,
            `EXPO_PUBLIC_FIREBASE_PROJECT_ID=${projectId}`,
            `EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${projectId}.firebaseapp.com`,
            `EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${config.project_info?.storage_bucket || `${projectId}.firebasestorage.app`}`,
            `EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${config.project_info?.project_number || ''}`,
            `EXPO_PUBLIC_FIREBASE_ANDROID_APP_ID=${appId}`,
            `EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=${androidClientId}`,
            `EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${webClientId}`,
          ].join('\n') + '\n');
          NODE

      - name: Make Gradle wrapper executable
        working-directory: LilyCrest-Clean/frontend/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: LilyCrest-Clean/frontend/android
        run: ./gradlew assembleProductionRelease
